<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vega IDE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="layout">
        <div id="tree-container" class="block">
            <div id="tree-top-bar">
                <div id="name">Root</div>
                <div id="add-file-button"></div>
                <div id="add-folder-button"></div>
            </div>

            <div class="folder" id="Work" data-path="//Work">
                <div class="folder-header">
                    <div class="folder-name">Work</div>
                    <div class="folder-arrow">▶</div>
                </div>

                <div class="folder-body">
                    <div class="file" data-path="//Work/file1.txt">
                        <div class="file-header">file1.txt</div>
                    </div>

                    <div class="folder" id="second-folder" data-path="//Work/second-folder">
                        <div class="folder-header">
                            <div class="folder-name">second-folder</div>
                            <div class="folder-arrow">▶</div>
                        </div>

                        <div class="folder-body">
                            <div class="file" data-path="//Work/second-folder/file2.txt">
                                <div class="file-header">file2.txt</div>
                            </div>
                            <div class="file" data-path="//Work/second-folder/file3.txt">
                                <div class="file-header">file3.txt</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div id="terminal" class="block">
            <div class="terminal-overlay"></div>
            <div id="terminal-input">
                <span id="prompt"></span>
                <span id="command"></span>
                <span id="cursor"></span>
            </div>
        </div>


        <div id="editor" class="block"></div>

        <div id="horizontal-separator"></div>
        <div id="vertical-separator"></div>
    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
