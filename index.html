<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert's custom IDE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="layout">
        <div id="tree-container" class="block">
            <div id="tree-top-bar">
                <div id="add-file-button"></div>
                <div id="add-folder-button"></div>
                <div class="close-button" id="tree-close-button"> <div class="close-button-image"></div> </div>
            </div>

            <div class="folder" id="Work">
                <div class="folder-header">
                    <div class="folder-arrow">▶</div>
                    <div class="folder-name">Work</div>
                </div>

                <div class="folder-body">
                    <div class="file" id="file.txt">
                        <div class="file-header">file.txt</div>
                    </div>
                    <div class="file" id="file2.txt">
                        <div class="file-header">file2.txt</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="terminal" class="block">
            <div class="terminal-overlay"></div>
            <div id="terminal-input">
                <span id="prompt"></span>
                <span id="command"></span>
                <span id="cursor"></span>
            </div>
        </div>


        <div id="editor" class="block"></div>

        <div id="horizontal-separator"></div>
        <div id="vertical-separator"></div>
    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
