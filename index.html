<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vega IDE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="layout">
        <div id="tree-container" class="block">
            <div id="tree-top-bar">
                <div id="name">Root</div>
                <div id="add-file-button"></div>
                <div id="add-folder-button"></div>
            </div>
            <div class="file folder" id="work"></div>
        </div>
        <div id="terminal" class="block">
            <div class="terminal-overlay"></div>
            <div id="terminal-input">
                <span id="prompt"></span>
                <span id="command"></span>
                <span id="cursor"></span>
            </div>
        </div>
        <div id="file" class="block"></div>

        <div id="horizontal-separator"></div>
        <div id="vertical-separator"></div>
    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
